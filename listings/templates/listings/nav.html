<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="{% url 'index' %}">🐻 HomesForBears</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'apartmentss' %}">Browse</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'Landlord_create' %}">Add Review</a></li>
        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{% url 'edit_profile' %}">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'register_user' %}">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
        {% endif %}
      </ul>
      <form class="d-flex gap-2" id="searchForm" method="POST">
        {% csrf_token %}
        <select class="form-select form-select-sm" name="search-type" id="searchType" style="width:120px;">
          <option value="apartment">Housing</option>
          <option value="landlord">Landlord</option>
        </select>
        <input class="form-control form-control-sm search-input" type="search" placeholder="Search…" name="searched">
        <button class="btn btn-gold btn-sm" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

<script>
document.getElementById("searchForm").addEventListener("submit", function(e) {
  e.preventDefault();
  this.action = document.getElementById("searchType").value === "apartment"
    ? "{% url 'search-apartments' %}"
    : "{% url 'search-landlords' %}";
  this.submit();
});
</script>
