{% include 'myapp/nav.html' %}
<body class="berkeley-blue-background">
  {% block content %}
  <style>
      .berkeley-gold-background {
          background-color: #FAF3E0;
      }
  </style>
  <style>
      .berkeley-blue-background {
          background-color: #FDB515;
          padding: 20px; /* Optional: Add padding for better spacing */
      }
  </style>
   <div class = "shadow p-4 mb-5 bg-body rounded">
    <h1>Login</h1>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

<br/><br/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <div class = "container ">
      {% if messages  %}
        {% for message in messages %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          <strong>{{ message }}</strong>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
          
        {% endfor %}
      {% endif %}

    </div>
  

        
    <form action="" method="POST" class="berkeley-gold-background">
            {% csrf_token %}
            <form>
                <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Username</label>
                  <input type="text" class="form-control" name="Username" aria-describedby="emailHelp">
                <div class="mb-3">
                  <label for="exampleInputPassword1" class="form-label">Password</label>
                  <input type="password" class="form-control" name="Password">
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
              <br></br>
              <br></br>
            <p>Forgot Password?</p>
            <a href="{% url 'password_reset' %}" class="btn btn-primary" style="font-size: 12px; padding: 10px 20px;">Change Password</a>

            </div>



{% endblock %}
