{% block content %}
    <center> 
        <h1> {{ house.Address }} </h1>
        Rating: {{ house.Rating }}/5 </br>
        Description: </br>
        {{ house.Description }} </br>
        Price Per Month: ${{ house.Price }} </br>
        LandLords Full Name: {{ house.LandLord }} </br>
        <br>
        {% if house.housing_image %}
        <img src = "{{ house.housing_image.url }}">
        {% endif %}
        <div style="margin-top: 60vh;"></div> <!-- Add a div with margin-top to push the home button to the bottom of the page -->
        <a href="{% url 'index' %}" class="btn btn-primary" style="font-size: 18px; padding: 12px 30px; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);">Home</a> <!-- Use CSS to position the home button at the bottom of the page and centered horizontally -->

    </center>
{% endblock %}
