<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
{% include 'myapp/nav.html' %}

{% block content %}

    <div class="container text-center">
        {% if searched %}
        <h1>You Searched For {{ searched }}</h1><br/>
        <div class="mt-4">
            {% for landlord in landlords %}
                <a href="{% url 'show-landlord' landlord.id %}" class="btn btn-outline-primary mb-3">
                    {{ landlord.FullName }} - Rating: {{ landlord.Rating }}/5
                </a><br/>
            {% endfor %}
        </div>
        {% else %}
        <h1>Hey! You Forgot To Search For A Landlord...</h1>
        {% endif %}

<a href="{% url 'index' %}" class="btn btn-secondary" style="font-size: 18px; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);">Home</a>
</div>
</div>
{% endblock %}
