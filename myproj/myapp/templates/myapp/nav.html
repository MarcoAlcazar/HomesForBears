<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">CalHabitat</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'logout' %}">Logout</a>
        {% else %}
          <a class="nav-link" href="{% url 'register_user' %}">Register</a>
          <a class="nav-link" href="{% url 'login' %}">Login</a>
        {% endif %}
      </ul>
      <form class="d-flex ms-auto" id="searchForm" method="POST">
        {% csrf_token %}
        <div class="input-group">
          <select class="form-select" name="search-type" id="searchType">
            <option value="apartment">Apartment</option>
            <option value="landlord">Landlord</option>
          </select>
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="searched">
          <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
      </form>
    </div>
  </div>
</nav>



<script>
document.getElementById("searchForm").addEventListener("submit", function(event) {
  event.preventDefault();
  var searchType = document.getElementById("searchType").value;
  if (searchType === "apartment") {
    this.action = "{% url 'search-apartments' %}";
  } else if (searchType === "landlord") {
    this.action = "{% url 'search-landlords' %}";
  }
  this.submit();
});
</script>
