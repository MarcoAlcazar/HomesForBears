{% include 'myapp/nav.html' %}
{% block content %}
<div class="content-container" style="background-color: #FDB515; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">
    <center>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIa6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <div class="container">
            <h1 class="display-4">{{ landlord.FullName }}</h1>
            <p class="h3">Rating: {{ landlord.Rating }}/5</p>
            <p class="lead">Description:</p>
            <p>{{ landlord.Description }}</p>
        </div>
    </center>
    <center>
    <div class="mt-auto">
        <a href="{% url 'index' %}" class="btn btn-primary">Home</a>
    </div>
</center>
</div>
{% endblock %}
