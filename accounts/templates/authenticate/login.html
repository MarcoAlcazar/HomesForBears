{% extends 'base.html' %}
{% block title %}Login – HomesForBears{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Welcome back</h2>
    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    {% endif %}
    <form action="" method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" class="form-control" name="Username" autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control" name="Password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-1">Login</button>
    </form>
    <hr class="my-4">
    <div class="text-center small">
      <a href="{% url 'reset_password' %}">Forgot password?</a>
      &nbsp;·&nbsp;
      <a href="{% url 'register_user' %}">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
