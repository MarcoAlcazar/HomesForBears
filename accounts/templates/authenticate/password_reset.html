{% extends 'base.html' %}
{% block title %}Reset Password – HomesForBears{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Reset your password</h2>
    <p class="text-muted mb-4">Enter your email address and we'll send you instructions to reset your password.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100">Send Reset Email</button>
    </form>
    <p class="text-center small mt-3"><a href="{% url 'login' %}">&larr; Back to login</a></p>
  </div>
</div>
{% endblock %}
