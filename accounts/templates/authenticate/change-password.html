{% extends 'base.html' %}
{% block title %}Change Password – HomesForBears{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="form-card">
    <h2>Change Password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary mt-2 px-4">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
