{% extends 'base.html' %}
{% block title %}New Password – HomesForBears{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Set new password</h2>
    <p class="text-muted mb-4">Enter your new password twice for confirmation.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100 mt-2">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
